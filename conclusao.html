<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabéns! - Flexbox Froggy</title>
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #43A047;
        }

        .cartao-conclusao {
            width: min(100%, 480px);
            padding: 45px 30px;
            background-color: #ffffff;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
            animation: aparecer 0.5s ease;
        }

        .icone {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            color: #43A047;
            font-size: 34px;
            margin-bottom: 18px;
        }

        .mensagem {
            color: #2C3E50;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .descricao {
            color: #666666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .botao {
            display: inline-block;
            padding: 13px 25px;
            background-color: #43A047;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 7px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .botao:hover {
            background-color: #2e7d32;
            transform: translateY(-2px);
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }
    </style>
</head>
<body>
    <main class="cartao-conclusao">
        <div class="icone">🎉</div>

        <h1>Parabéns!</h1>

        <p class="mensagem">
            Você concluiu todas as 24 fases do Flexbox Froggy!
        </p>

        <p class="descricao">
            Agora você já conhece diversas propriedades do Flexbox
            e pode colocar seus conhecimentos em prática.
        </p>

        <a href="index.html" class="botao">
            Jogar novamente
        </a>
    </main>
</body>
</html>
